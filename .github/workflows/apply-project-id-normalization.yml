name: Apply project ID normalization

on:
  push:
    branches:
      - "feat/normalize-project-id-spaces"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Normalize Project ID whitespace in the UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/desktop.rs')
          text = path.read_text()

          pattern = re.compile(
              r'(?P<indent>[ \t]*)ui\.add_sized\(\n'
              r'(?P=indent)    \[420\.0, 34\.0\],\n'
              r'(?P=indent)    egui::TextEdit::singleline\(&mut self\.create_project_id\)\n'
              r'(?P=indent)        \.hint_text\("e\.g\. hashmap-deep-dive"\),\n'
              r'(?P=indent)\);'
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit('Project ID input anchor not found')
          indent = match.group('indent')
          replacement = '\n'.join([
              indent + 'let project_id_response = ui.add_sized(',
              indent + '    [420.0, 34.0],',
              indent + '    egui::TextEdit::singleline(&mut self.create_project_id)',
              indent + '        .hint_text("e.g. hashmap-deep-dive"),',
              indent + ');',
              indent + 'if project_id_response.changed() {',
              indent + '    self.create_project_id = normalize_project_id_input(&self.create_project_id);',
              indent + '}',
              indent + 'ui.small("Spaces are converted to hyphens automatically.");',
          ])
          text = text[:match.start()] + replacement + text[match.end():]

          marker = '\npub fn run_desktop() -> eframe::Result<()> {'
          if marker not in text:
              raise SystemExit('run_desktop insertion anchor not found')
          helper = '\n'.join([
              'fn normalize_project_id_input(value: &str) -> String {',
              '    let mut normalized = String::with_capacity(value.len());',
              '    let mut separator_pending = false;',
              '',
              '    for character in value.chars() {',
              '        if character.is_whitespace() {',
              '            separator_pending = !normalized.is_empty();',
              '            continue;',
              '        }',
              '',
              "        if separator_pending && character != '-' && !normalized.ends_with('-') {",
              "            normalized.push('-');",
              '        }',
              '        separator_pending = false;',
              '        normalized.push(character);',
              '    }',
              '',
              '    normalized',
              '}',
              '',
              '#[cfg(test)]',
              'mod desktop_tests {',
              '    use super::normalize_project_id_input;',
              '',
              '    #[test]',
              '    fn project_id_whitespace_is_normalized_to_hyphens() {',
              '        assert_eq!(',
              '            normalize_project_id_input("HashMap Deep Dive"),',
              '            "HashMap-Deep-Dive"',
              '        );',
              '        assert_eq!(',
              '            normalize_project_id_input("  HashMap   Deep\\tDive  "),',
              '            "HashMap-Deep-Dive"',
              '        );',
              '        assert_eq!(',
              '            normalize_project_id_input("HashMap - Deep Dive"),',
              '            "HashMap-Deep-Dive"',
              '        );',
              '    }',
              '}',
              '',
          ])
          text = text.replace(marker, '\n' + helper + marker, 1)
          path.write_text(text)
          PY
      - name: Format implementation
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/apply-project-id-normalization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/desktop.rs .github/workflows/apply-project-id-normalization.yml
          git commit -m "feat: normalize project ID whitespace"
          git push origin HEAD:feat/normalize-project-id-spaces
