name: Fix macOS folder picker

on:
  push:
    branches: [feat/data-root-folder-picker]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply fix
        run: python3 .github/scripts/fix_macos_folder_picker.py
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/fix-macos-folder-picker.yml
          rm .github/scripts/fix_macos_folder_picker.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/desktop.rs .github/workflows/fix-macos-folder-picker.yml .github/scripts/fix_macos_folder_picker.py
          git commit -m "fix: correct macOS Data Root chooser script"
          git push origin HEAD:feat/data-root-folder-picker
