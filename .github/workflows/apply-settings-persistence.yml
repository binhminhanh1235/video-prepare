name: Apply settings persistence

on:
  push:
    branches:
      - feat/persist-runtime-settings

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/apply_settings_persistence.py
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/apply_settings_persistence.py
          rm .github/workflows/apply-settings-persistence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/settings.rs src/desktop.rs docs/runtime-settings.md .github/apply_settings_persistence.py .github/workflows/apply-settings-persistence.yml
          git commit -m "feat: persist runtime settings across launches"
          git push origin HEAD:feat/persist-runtime-settings
