name: Apply Data Root folder picker

on:
  push:
    branches: [feat/data-root-folder-picker]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply patch
        run: python3 .github/scripts/apply_data_root_folder_picker.py
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/apply-data-root-folder-picker.yml
          rm .github/scripts/apply_data_root_folder_picker.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/desktop.rs docs/runtime-settings.md .github/workflows/apply-data-root-folder-picker.yml .github/scripts/apply_data_root_folder_picker.py
          git commit -m "feat: choose Data Root with system folder browser"
          git push origin HEAD:feat/data-root-folder-picker
