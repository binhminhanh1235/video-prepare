name: one-shot UX usability pass 4

on:
  push:
    branches:
      - feat/ux-consolidation-workspace
    paths:
      - tools/apply_ux_pass4.py
      - .github/workflows/ux-pass4-one-shot.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux-consolidation-workspace
          fetch-depth: 0

      - name: Apply UX pass 4 patch
        run: python3 tools/apply_ux_pass4.py

      - name: Format
        run: cargo fmt --all --check || (cargo fmt --all && cargo fmt --all --check)

      - name: Check
        run: cargo check --locked --all-targets --all-features

      - name: Test
        run: cargo test --locked --all-targets --all-features

      - name: Commit implementation and remove one-shot files
        run: |
          rm -f tools/apply_ux_pass4.py .github/workflows/ux-pass4-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add script drop intake and local image thumbnails"
          git push origin HEAD:feat/ux-consolidation-workspace
