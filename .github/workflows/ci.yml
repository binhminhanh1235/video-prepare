name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply P2.02 borrow-check fix
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/p2-visual-download-retry'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/visual.rs')
          text = path.read_text()
          old = '        let scene_id = project.prepared_script.scenes[scene_index].id.as_str();'
          new = '        let scene_id = project.prepared_script.scenes[scene_index].id.clone();'
          if old not in text:
              raise SystemExit('expected scene_id borrow pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/visual.rs
          git commit -m "fix: own scene id across visual state persistence"
          git push origin HEAD:feat/p2-visual-download-retry

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Validate canonical example
        run: cargo run --locked --quiet -- validate examples/demo.vprep

      - name: Create and reopen canonical project
        shell: bash
        run: |
          DATA_ROOT="$(mktemp -d)"
          cargo run --locked --quiet -- create-project "$DATA_ROOT" demo-project examples/demo.vprep
          cargo run --locked --quiet -- open-project "$DATA_ROOT/projects/demo-project"
          test -f "$DATA_ROOT/projects/demo-project/input/script.vprep"
          test -f "$DATA_ROOT/projects/demo-project/project.json"
          test -f "$DATA_ROOT/projects/demo-project/status.json"
