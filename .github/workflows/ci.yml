name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Normalize P2.02 feature source
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/p2-visual-download-retry'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/visual.rs')
          text = path.read_text()

          old_loop = '''        for scene_index in 0..project.prepared_script.scenes.len() {
              let scene_spec = &project.prepared_script.scenes[scene_index];
              for request_index in 0..scene_spec.visuals.len() {
                  let request = &scene_spec.visuals[request_index];
          '''
          new_loop = '''        for scene_index in 0..project.prepared_script.scenes.len() {
              let request_count = project.prepared_script.scenes[scene_index].visuals.len();
              for request_index in 0..request_count {
                  let request = project.prepared_script.scenes[scene_index].visuals[request_index].clone();
          '''
          if old_loop not in text:
              raise SystemExit('expected run loop pattern not found')
          text = text.replace(old_loop, new_loop, 1)
          text = text.replace(
              '                    request,\n                )?;',
              '                    &request,\n                )?;',
              1,
          )

          old_sig = '''    fn execute_request(
              &self,
              project: &StoredProject,
          '''
          new_sig = '''    fn execute_request(
              &self,
              project: &mut StoredProject,
          '''
          if old_sig not in text:
              raise SystemExit('expected execute_request signature not found')
          text = text.replace(old_sig, new_sig, 1)
          path.write_text(text)
          PY

          cargo fmt --all
          if git diff --quiet -- src/visual.rs; then
            echo "P2.02 source already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/visual.rs
          git commit -m "fix: normalize visual executor borrow boundary"
          git push origin HEAD:feat/p2-visual-download-retry

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Validate canonical example
        run: cargo run --locked --quiet -- validate examples/demo.vprep

      - name: Create and reopen canonical project
        shell: bash
        run: |
          DATA_ROOT="$(mktemp -d)"
          cargo run --locked --quiet -- create-project "$DATA_ROOT" demo-project examples/demo.vprep
          cargo run --locked --quiet -- open-project "$DATA_ROOT/projects/demo-project"
          test -f "$DATA_ROOT/projects/demo-project/input/script.vprep"
          test -f "$DATA_ROOT/projects/demo-project/project.json"
          test -f "$DATA_ROOT/projects/demo-project/status.json"
