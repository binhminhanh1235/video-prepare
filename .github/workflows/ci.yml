name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format P3 source once
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/p3-omnivoice-client'
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "style: format P3 OmniVoice client"
            git push origin HEAD:feat/p3-omnivoice-client
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Validate canonical example
        run: cargo run --locked --quiet -- validate examples/demo.vprep

      - name: Create and reopen canonical project
        shell: bash
        run: |
          DATA_ROOT="$(mktemp -d)"
          cargo run --locked --quiet -- create-project "$DATA_ROOT" demo-project examples/demo.vprep
          cargo run --locked --quiet -- open-project "$DATA_ROOT/projects/demo-project"
          test -f "$DATA_ROOT/projects/demo-project/input/script.vprep"
          test -f "$DATA_ROOT/projects/demo-project/project.json"
          test -f "$DATA_ROOT/projects/demo-project/status.json"
