name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply artifact transport accessors once
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/p3-audio-artifact-import'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/providers/omnivoice.rs')
          text = path.read_text()
          if 'bearer_token_for_request' not in text:
              pattern = r'(    pub fn base_url\(&self\) -> &str \{\n        &self\.normalized_base_url\n    \}\n)'
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit('base_url accessor structure not found')
              addition = '''

    pub(crate) fn http_client(&self) -> &Client {
        &self.client
    }

    pub(crate) fn bearer_token_for_request(&self) -> Option<&str> {
        self.bearer_token.as_deref()
    }
'''
              text = text[:match.end()] + addition + text[match.end():]
              path.write_text(text)
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "refactor: share authenticated OmniVoice transport internally"
            git push origin HEAD:feat/p3-audio-artifact-import
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Validate canonical example
        run: cargo run --locked --quiet -- validate examples/demo.vprep

      - name: Create and reopen canonical project
        shell: bash
        run: |
          DATA_ROOT="$(mktemp -d)"
          cargo run --locked --quiet -- create-project "$DATA_ROOT" demo-project examples/demo.vprep
          cargo run --locked --quiet -- open-project "$DATA_ROOT/projects/demo-project"
          test -f "$DATA_ROOT/projects/demo-project/input/script.vprep"
          test -f "$DATA_ROOT/projects/demo-project/project.json"
          test -f "$DATA_ROOT/projects/demo-project/status.json"
