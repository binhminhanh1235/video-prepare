name: one-shot UX consolidation

on:
  push:
    branches:
      - feat/ux-consolidation-workspace

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux-consolidation-workspace
          fetch-depth: 0

      - name: Apply UX patch
        run: python3 .github/scripts/apply_ux_consolidation.py

      - name: Format
        run: cargo fmt --all && cargo fmt --all --check

      - name: Check
        run: cargo check --locked --all-targets --all-features

      - name: Test
        run: cargo test --locked --all-targets --all-features

      - name: Commit implementation and remove one-shot files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ux-consolidation-one-shot.yml .github/scripts/apply_ux_consolidation.py
          git add src/desktop.rs
          git commit -m "feat: consolidate desktop UX around project workspace"
          git push origin HEAD:feat/ux-consolidation-workspace
