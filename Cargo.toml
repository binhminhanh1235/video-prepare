[package]
name = "video-prepare"
version = "0.1.0"
edition = "2021"
description = "Local-first Rust desktop app for preparing visual and audio assets from a structured video script"
license = "MIT"
publish = false

[dependencies]
eframe = "0.33"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.13"
thiserror = "2.0"
