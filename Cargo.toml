[package]
name = "video-prepare"
version = "0.1.0"
edition = "2021"
description = "Local-first Rust desktop app for preparing visual and audio assets from a structured video script"
license = "MIT"
publish = false

[dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
